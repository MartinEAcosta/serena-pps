<div class="form-section" [ngClass]="{'open' : isOpen()}">
    <div class="container-title"
    (click)="toggleOpen()">
        <h3 class="title-section">{{ title }}</h3>
        <div class="svg-container" >
            <div class="container-down-icon">
                <svg class="down-icon" fill="#000000" width="16px" height="16px" viewBox="0 0 96 96"
                    xmlns="http://www.w3.org/2000/svg" stroke="#000000">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <path
                            d="M69.8437,43.3876,33.8422,13.3863a6.0035,6.0035,0,0,0-7.6878,9.223l30.47,25.39-30.47,25.39a6.0035,6.0035,0,0,0,7.6878,9.2231L69.8437,52.6106a6.0091,6.0091,0,0,0,0-9.223Z">
                        </path>
                    </g>
                </svg>
            </div>
        </div>
    </div>
    <ng-content class="content" select="[container-inputs]">
    </ng-content>
</div>
