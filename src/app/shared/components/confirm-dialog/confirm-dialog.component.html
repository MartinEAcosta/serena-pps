@if (state(); as dialog) {
  <div class="confirm-overlay" (click)="onCancel()">
    <div class="confirm-box" (click)="$event.stopPropagation()">
      <h3 class="confirm-title">{{ dialog.title ?? 'Confirmar acción' }}</h3>
      <p class="confirm-message">{{ dialog.message }}</p>
      <div class="confirm-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">
          {{ dialog.cancelLabel ?? 'Cancelar' }}
        </button>
        <button type="button" class="btn-confirm" (click)="onConfirm()">
          {{ dialog.confirmLabel ?? 'Confirmar' }}
        </button>
      </div>
    </div>
  </div>
}
