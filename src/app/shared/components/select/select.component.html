<div class="container-filter">
    <div class="container-filter-select" [class.is-disabled]="disabled()" [attr.aria-disabled]="disabled()">
        <div class="container-select">
            <div class="option-default">
                <p class="option-default-selected">
                    {{ selected() != null ? selected()?.label : placeholder() }}
                </p>
                <div class="container-down-icon">
                    <svg class="down-icon" fill="#000000" width="16px" height="16px" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" stroke="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><title></title><path d="M69.8437,43.3876,33.8422,13.3863a6.0035,6.0035,0,0,0-7.6878,9.223l30.47,25.39-30.47,25.39a6.0035,6.0035,0,0,0,7.6878,9.2231L69.8437,52.6106a6.0091,6.0091,0,0,0,0-9.223Z"></path></g></svg>
                </div>
            </div>
            <div class="container-options">
                <ul class="options">
                    @for (item of options(); track item.label) {
                        <li class="option-filter" (click)="onClick( item )">
                            {{ item.label }}
                        </li>
                    }
                </ul>
            </div>
        </div>
    </div>
</div>
