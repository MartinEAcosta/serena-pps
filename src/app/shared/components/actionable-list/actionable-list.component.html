<div class="list">
    @for (item of mapSignal | keyvalue; track item.key; let i = $index) {
        <div class="row" [class.selected]="item.value === selectedItem">
            <div class="row-left">
                <div class="row-num">{{ i+1 }}</div>
                <div class="row-title">
                    <p>{{item.key}}</p>
                </div>
                @if (item.value === selectedItem) {
                    <span class="tag-edit">Editando</span>
                }
            </div>
            <div class="row-actions">
                <div class="icon-btn eye" (click)="this.visualizeItem.emit(item.key)" aria-label="Ver y editar">
                    <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                        <g id="SVGRepo_iconCarrier">
                            <path
                                d="M9 4.45962C9.91153 4.16968 10.9104 4 12 4C16.1819 4 19.028 6.49956 20.7251 8.70433C21.575 9.80853 22 10.3606 22 12C22 13.6394 21.575 14.1915 20.7251 15.2957C19.028 17.5004 16.1819 20 12 20C7.81811 20 4.97196 17.5004 3.27489 15.2957C2.42496 14.1915 2 13.6394 2 12C2 10.3606 2.42496 9.80853 3.27489 8.70433C3.75612 8.07914 4.32973 7.43025 5 6.82137"
                                stroke="#F6F6F6" stroke-width="1.5" stroke-linecap="round"></path>
                            <path
                                d="M15 12C15 13.6569 13.6569 15 12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9C13.6569 9 15 10.3431 15 12Z"
                                stroke="#F6F6F6" stroke-width="1.5"></path>
                        </g>
                    </svg>
                </div>
                <div class="icon-btn trash" (click)="this.removeItem.emit(item.key)" aria-label="Eliminar">
                    <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                        <g id="SVGRepo_iconCarrier">
                            <path
                                d="M4 6H20M16 6L15.7294 5.18807C15.4671 4.40125 15.3359 4.00784 15.0927 3.71698C14.8779 3.46013 14.6021 3.26132 14.2905 3.13878C13.9376 3 13.523 3 12.6936 3H11.3064C10.477 3 10.0624 3 9.70951 3.13878C9.39792 3.26132 9.12208 3.46013 8.90729 3.71698C8.66405 4.00784 8.53292 4.40125 8.27064 5.18807L8 6M18 6V16.2C18 17.8802 18 18.7202 17.673 19.362C17.3854 19.9265 16.9265 20.3854 16.362 20.673C15.7202 21 14.8802 21 13.2 21H10.8C9.11984 21 8.27976 21 7.63803 20.673C7.07354 20.3854 6.6146 19.9265 6.32698 19.362C6 18.7202 6 17.8802 6 16.2V6"
                                stroke="#F6F6F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M14 10V17M10 10V17" stroke="#F6F6F6" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </g>
                    </svg>
                </div>
            </div>
        </div>
    }
</div>
@if (mapSignal.size === 0) {
    <p class="empty-state">{{ placeholder }}</p>
}
