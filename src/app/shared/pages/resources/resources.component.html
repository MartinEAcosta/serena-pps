        <div class="resources-header">
            <div class="header-left">
                <h1>RECURSOS ÚTILES</h1>
                <p>Encontrá aquí formularios, cartelería y normativas.</p>
            </div>
            <div class="header-right">
                <h2>Resolución 81/2019</h2>

                <div class="container-btn">
                    <button

                </div>
            </div>
        </div>
        <main>
            @for( resource of resourcesList; track resource ){
                <app-section-dropdown [titleHeader]="resource.titleHeader" [dropdownItems]="resource.dropdowns" />
            }
        </main>
    </div>    
</div>
