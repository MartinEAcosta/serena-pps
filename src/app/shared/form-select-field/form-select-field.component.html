<app-label-info [labelText]="labelText"
    [info]="info" />
<app-select 
    [options]="options" 
    [selected]="selectedOption"
    [placeholder]="placeholder" 
    (selectedChange)="onSelectedChange($event)"
    [disabled]="isDisabled"
/>
<div class="reserved-space">
    @if (isDisabled) {
        <span class="disabled-hint">{{ disabledHint }}</span>
    } @else {
        <app-label-error [control]="form.get(prefix)!" />
    }
</div>
